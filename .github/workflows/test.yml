name: Comprehensive Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, zsh]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install BATS
        run: |
          git clone https://github.com/bats-core/bats-core.git
          sudo bats-core/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl coreutils zsh

      - name: Setup test environment
        run: |
          chmod +x test/test_helper.sh
          echo "Test environment ready"

      - name: Run Smoke Tests
        id: smoke
        run: |
          echo "🚀 Running smoke tests..."
          bats test/contexts/smoke.bats

      - name: Run Unit Tests
        id: unit
        run: |
          echo "🧪 Running unit tests..."
          bats test/unit/

      - name: Run Negative Tests
        id: negative
        run: |
          echo "❌ Running negative tests..."
          bats test/contexts/negative.bats

      - name: Run Edge Tests
        id: edge
        run: |
          echo "🔍 Running edge tests..."
          bats test/contexts/edge.bats

      - name: Run Security Tests
        id: security
        run: |
          echo "🔒 Running security tests..."
          bats test/contexts/security.bats

      - name: Run Exception Tests
        id: exception
        run: |
          echo "⚠️ Running exception tests..."
          bats test/contexts/exception.bats

      - name: Run Regression Tests
        id: regression
        run: |
          echo "🔄 Running regression tests..."
          bats test/contexts/regression.bats

      - name: Run Compliance Tests
        id: compliance
        run: |
          echo "📋 Running compliance tests..."
          bats test/contexts/compliance.bats

      - name: Run Integration Tests
        id: integration
        run: |
          echo "🔄 Running integration tests..."
          bats test/contexts/integration.bats

      - name: Generate Test Report
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          NEGATIVE: ${{ steps.negative.outcome }}
          EDGE: ${{ steps.edge.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          EXCEPTION: ${{ steps.exception.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          COMPLIANCE: ${{ steps.compliance.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          for cat in Smoke Unit Negative Edge Security Exception Regression Compliance Integration; do
            upper=$(echo "$cat" | tr '[:lower:]' '[:upper:]' | tr ' ' '_')
            outcome="${!upper}"
            icon="✅"
            [ "$outcome" != "success" ] && icon="❌"
            echo "| ${cat} Tests | ${icon} |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs
          path: |
            .git/aicommit/
            test-results/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security tests
        run: |
          chmod +x test/test_helper.sh
          bats test/contexts/security.bats

      - name: Install security scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y gitleaks

      - name: Check for secrets
        run: |
          ./test/run_tests.sh --security
